name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  # A new push to a pull request cancels its running CI. Runs on master finish, so a deploy is never cut short.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-deploy:
    # Release Please's pull request and its merge hold only the version and the changelog: nothing to test or deploy.
    if: "${{ !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(master): release') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Adding Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Cache Angular build output
        id: cache-ng-build
        uses: actions/cache@v4
        with:
          path: dist
          key: ng-build-${{ hashFiles('package-lock.json', 'src/**', 'angular.json', 'scripts/gh-pages-before-add.js') }}
          restore-keys: |
            ng-build-${{ hashFiles('package-lock.json', 'src/**', 'angular.json', 'scripts/gh-pages-before-add.js') }}

      - name: Build Application
        run: npm run build
        if: steps.cache-ng-build.outputs.cache-hit != 'true'

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: 'http://localhost:4200/timer-5/'
        run: npm run e2e:ci

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          path: |
            test-results
            playwright-report
          archive: true
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

      - name: Deploy to Github Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && success()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git remote set-url origin https://git:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npm run deploy -- -u "github-actions-bot <support+actions@github.com>"
